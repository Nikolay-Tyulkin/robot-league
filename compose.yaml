services:
  game:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:8080"
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-512}"
      MAX_CONNECTIONS_PER_IP: "${MAX_CONNECTIONS_PER_IP:-64}"
      MAX_PLAYERS: "${MAX_PLAYERS:-200}"
      MAX_WAITING_PLAYERS: "${MAX_WAITING_PLAYERS:-10000}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
